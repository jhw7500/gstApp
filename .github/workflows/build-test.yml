name: gstApp Build and Test

on:
  pull_request:
    types: [opened, reopened]
    branches: [ main, master ]
    paths:
      - 'projects/gstApp/**'
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: Build gstApp
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/build')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gstApp

    steps:
      - name: Get PR Branch Info
        if: github.event_name == 'issue_comment'
        id: pr_info
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ steps.pr_info.outputs.ref || github.ref }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libgstrtspserver-1.0-dev \
            libglib2.0-dev \
            libjson-c-dev \
            libssl-dev \
            check \
            libturbojpeg0-dev \
            libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-tools \
            gstreamer1.0-x \
            gstreamer1.0-alsa \
            gstreamer1.0-gl \
            gstreamer1.0-gtk3 \
            gstreamer1.0-qt5 \
            gstreamer1.0-pulseaudio

      - name: Build
        run: |
          # Try make, fallback if it fails due to missing rnnoise or similar specific paths
          # We might need to mock or adjust Makefile for CI environment if paths are hardcoded
          make || { echo "Build failed. Check dependencies."; exit 1; }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gstApp-binary
          path: projects/gstApp/bin/gstApp
          if-no-files-found: warn
